name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: npm ci --ignore-scripts
      - run: npm test

  dsh-runtime-contracts:
    runs-on: macos-15
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        dsh: ['0.1.5-rc.1', '0.2.0-rc.2']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: npm ci --ignore-scripts
      - name: Install DSH ${{ matrix.dsh }} contract dependencies
        run: node tools/install-dsh-contract-deps.mjs ${{ matrix.dsh }}
      - name: Verify real runtime imports
        run: npm run test:runtime-imports
        env:
          DSH_EXPECTED_VERSION: ${{ matrix.dsh }}
      - name: Verify desktop runtime contract
        if: startsWith(matrix.dsh, '0.2.')
        run: npm run test:desktop-compat
        env:
          DSH_DESKTOP_NODE_MODULES: node_modules
